name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  # pull_request:
  #   branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble # Match your Playwright version
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # - name: Install Playwright Browsers
      #   run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
        env:
          URL: ${{ secrets.URL }}
      - name: Generate Allure report
        if: ${{ always() }}
        run: npx allure generate allure-results --clean -o allure-report
      - name: Combine reports into one folder
        if: ${{ always() }}
        run: |
          mkdir -p public-reports/allure public-reports/playwright
          cp -r allure-report/* public-reports/allure/ || true
          cp -r playwright-report/* public-reports/playwright/ || true
      - name: Deploy reports to GitHub Pages
        if: ${{ always() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-reports
          destination_dir: reports
      - name: Add clickable report links to Job Summary
        if: ${{ always() }}
        run: |
          echo "### 📊 Test Reports" >> $GITHUB_STEP_SUMMARY
          echo "- **Open Allure Report**" >> $GITHUB_STEP_SUMMARY
          echo "- **Open Playwright Report**" >> $GITHUB_STEP_SUMMARY
